name: Train Model and Release

on:
  push:
    paths:
      - 'annotations/**'
      - 'images/**'
      - 'model.py'
      - 'train.py'
      - '.github/workflows/**'

jobs:
  train-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get training metadata
        id: metadata
        run: |
          echo "train_date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "commit_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "image_count=$(ls -1 images/ | wc -l)" >> $GITHUB_OUTPUT
          echo "annotation_count=$(ls -1 annotations/ | wc -l)" >> $GITHUB_OUTPUT
        
      - name: Train model
        run: |
          PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.0 python train.py
          
      - name: Get current version
        id: get_version
        run: |
          # Try to find a version tag or set default
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "Current version: $VERSION"
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Bump version
        id: bump_version
        run: |
          # Extract major, minor, patch
          VERSION=${{ steps.get_version.outputs.current_version }}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Bump minor version, reset patch
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.bump_version.outputs.new_version }}
          release_name: Release ${{ steps.bump_version.outputs.new_version }}
          body: |
            Automatically trained model based on new data.

            Information:
            - Trained Date: ${{ steps.metadata.outputs.train_date }}
            - **Trained By:** @${{ github.actor }}
            - **Commit:** ${{ steps.metadata.outputs.commit_sha }}
            - **Dataset:** ${{ steps.metadata.outputs.image_count }} images with ${{ steps.metadata.outputs.annotation_count }} annotations.
        
            
            Changes:
            - Updated model trained with latest images and annotations
            - Training history graph attached

            *For more information, please see the README file in the repository.*
          draft: false
          prerelease: true
          
      - name: Upload Model Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./model.pth
          asset_name: model.pth
          asset_content_type: application/octet-stream
          
      - name: Upload Graph Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./loss_graph.png
          asset_name: loss_graph.png
          asset_content_type: image/png
