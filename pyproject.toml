[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tof-pose-estimation"
version = "0.1.0"
description = "Hybrid 3D front-end and tiny depth-native pose runtime for Arducam ToF on Raspberry Pi 5."
readme = "README_V8.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
runtime = [
  "tflite-runtime>=2.14; platform_machine == 'aarch64'",
  "opencv-python>=4.8"
]
train = [
  "tensorflow>=2.14"
]

[project.scripts]
tof-pose = "tof_pose.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tof_pose", "tof_pose.*"]
