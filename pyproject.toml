[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macchiato-pose"
version = "9.0.0"
description = "Scene-split Time-of-Flight pose experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.11,<5,!=4.13.0.90",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "ultralytics==8.4.103",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
macchiato-manifest = "macchiato.create_manifest:main"
macchiato-train = "macchiato.train:main"
macchiato-evaluate = "macchiato.evaluation.evaluate_generalization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
